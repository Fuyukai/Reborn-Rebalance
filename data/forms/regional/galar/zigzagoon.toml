internal_name = "ZIGZAGOON"
custom_init = "chancemaps=[153,519]\n# Map IDs for galarian form\nif $game_map && chancemaps.include?($game_map.map_id)\n    randomnum = rand(2)\n    if randomnum == 1\n        next 1\n    elsif randomnum == 0\n        next 0\n    end\nelse\n    next 0\nend\n"

[form_mapping]
0 = "Hoenn"
1 = "Galar"

