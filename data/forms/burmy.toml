internal_name = "BURMY"
custom_init = "begin #horribly stupid section to make the battle stress test work\ncase $fefieldeffect\n    when 1,5,6,10,11,17,18,19,24,26,29,30,35,36,37\n        next 2 # Trash Cloak\n    when 2,3,7,8,9,15,21,22,31,33,34\n        next 0 # Plant Cloak\n    when 4,12,13,14,16,20,23,25,27,28,32\n        next 1 # Sandy CloaK\nend\nenv=pbGetEnvironment()\nif env==PBEnvironment::Sand || env==PBEnvironment::Rock || env==PBEnvironment::Cave\n    next 1 # Sandy Cloak\nelsif !pbGetMetadata($game_map.map_id,MetadataOutdoor)\n    next 2 # Trash Cloak\nelse\n    next 0 # Plant Cloak\nend\nrescue\n    next 0\nend\n"

[form_mapping]
0 = "Plant Cloak"
1 = "Sandy Cloak"
2 = "Trash Cloak"
